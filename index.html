<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA visualizations</title>
<style>
:root{--bg:#fff;--surface:#f5f5f2;--text:#1f1f1d;--text2:#5f5e5a;--border:#d3d1c7;--accent:#185fa5}
@media (prefers-color-scheme: dark){:root{--bg:#1c1c1a;--surface:#2a2a27;--text:#f1efe8;--text2:#b4b2a9;--border:#444441;--accent:#85b7eb}}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:26px;font-weight:500;margin:0 0 4px}
p{color:var(--text2);margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a.card{display:block;padding:14px 18px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text)}
a.card:hover{background:var(--surface)}
a.card span{display:block;color:var(--text2);font-size:14px}
a.card strong{font-weight:500;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>DSA visualizations</h1>
  <p>Interactive companions for the Data Structures and Algorithm Design lectures.</p>
  <ul>
    <li><a class="card" href="balanced-brackets/"><strong>Balanced brackets</strong><span>Lecture 6, stacks and queues. Step through the stack algorithm.</span></a></li>
  </ul>
</main>
</body>
</html>
